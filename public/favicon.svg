<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Light transparent green gradient for shield background -->
    <linearGradient id="greenTransShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.24" />
    </linearGradient>

    <!-- Outer shield border gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glowing light green gradient for G -->
    <linearGradient id="gTextGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="50%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Soft green ambient light glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow behind shield -->
  <path
    d="M 50 6 C 70 6 88 15 90 34 C 92 62 73 85 50 95 C 27 85 8 62 10 34 C 12 15 30 6 50 6 Z"
    fill="#10b981"
    fill-opacity="0.12"
    filter="url(#softGlow)"
  />

  <!-- Main Transparent Shield Body -->
  <path
    d="M 50 7 C 69 7 86 15 88 33 C 90 59 72 82 50 93 C 28 82 10 59 12 33 C 14 15 31 7 50 7 Z"
    fill="url(#greenTransShield)"
    stroke="url(#borderGradient)"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Inner subtle translucent reflection highlight rim -->
  <path
    d="M 50 14 C 64 14 78 20 80 34 C 81 54 67 73 50 82 C 33 73 19 54 20 34 C 22 20 36 14 50 14 Z"
    fill="none"
    stroke="#a7f3d0"
    stroke-width="1.5"
    stroke-opacity="0.35"
  />

  <!-- The Letter "G" centered in the shield -->
  <text
    x="50"
    y="66"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Arial Black', 'Cinzel', -apple-system, sans-serif"
    font-size="44"
    font-weight="900"
    letter-spacing="-1px"
    fill="url(#gTextGradient)"
    filter="url(#softGlow)"
  >G</text>
</svg>
